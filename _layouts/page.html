---
layout: default
---

<article class="page-content">
  {% if page.title %}
    <header class="page-header" style="margin-bottom: 2rem;">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="page-subtitle" style="font-size: 1.15rem; color: var(--text-muted);">{{ page.description }}</p>
      {% endif %}
    </header>
  {% endif %}

  {{ content }}
</article>
